services:
  postgres:
    image: postgres:17-alpine
    container_name: org-structure-api-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: org_structure_api
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d org_structure_api"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: org-structure-api-app
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/org_structure_api?sslmode=disable
      PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: